name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + release APK
        run: ./gradlew --no-daemon --stacktrace testReleaseUnitTest assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk music-light-synk.apk

      - uses: actions/upload-artifact@v4
        with:
          name: music-light-synk-apk
          path: music-light-synk.apk
          if-no-files-found: error

      - name: Attach APK to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: music-light-synk.apk
          generate_release_notes: true

  home-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Blueprints are valid and the MQTT one is up to date
        run: |
          pip install --quiet pyyaml
          python scripts/build_blueprints.py --check
          for f in home-assistant/blueprints/automation/*.yaml; do python scripts/check_blueprint.py "$f"; done
      - name: Custom integration compiles and its JSON is valid
        run: |
          python -m compileall -q custom_components/music_light_synk
          for f in custom_components/music_light_synk/*.json custom_components/music_light_synk/translations/*.json hacs.json; do python -m json.tool "$f" > /dev/null; done
