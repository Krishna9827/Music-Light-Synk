name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + release APK
        run: ./gradlew --no-daemon --stacktrace testReleaseUnitTest assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk music-light-synk.apk

      - uses: actions/upload-artifact@v4
        with:
          name: music-light-synk-apk
          path: music-light-synk.apk
          if-no-files-found: error

  home-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Blueprints are valid and the MQTT one is up to date
        run: |
          pip install --quiet pyyaml
          python scripts/build_blueprints.py --check
          for f in home-assistant/blueprints/automation/*.yaml; do python scripts/check_blueprint.py "$f"; done
      - name: Custom integration compiles and its JSON is valid
        run: |
          python -m compileall -q custom_components/music_light_synk
          for f in custom_components/music_light_synk/*.json custom_components/music_light_synk/translations/*.json hacs.json; do python -m json.tool "$f" > /dev/null; done
      - name: App and integration have the same version
        run: |
          APP=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          HA=$(python -c 'import json; print(json.load(open("custom_components/music_light_synk/manifest.json"))["version"])')
          echo "app $APP / integration $HA"
          test "$APP" = "$HA"
          grep -q "^## v$APP" CHANGELOG.md || { echo "CHANGELOG.md has no '## v$APP' section"; exit 1; }

  # Mac app + iPhone app (Swift). Core tests, the universal Mac app, and the iPhone app built
  # for the simulator (proves it compiles; you sign and install it from Xcode with your Apple ID).
  apple:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          echo "version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
          echo "code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Core tests (Swift)
        working-directory: apple
        run: swift test

      - name: Mac app
        run: |
          chmod +x scripts/build_mac_app.sh
          scripts/build_mac_app.sh "${{ steps.v.outputs.version }}" "${{ steps.v.outputs.code }}" build/music-light-synk-mac.zip

      - name: iPhone app (simulator build) and Xcode project zip
        run: |
          brew install xcodegen
          V="${{ steps.v.outputs.version }}"; C="${{ steps.v.outputs.code }}"
          sed -i '' -e "s/CFBundleShortVersionString: \".*\"/CFBundleShortVersionString: \"$V\"/" -e "s/CFBundleVersion: \".*\"/CFBundleVersion: \"$C\"/" ios/project.yml
          (cd ios && xcodegen generate)
          xcodebuild -quiet -project ios/MusicLightSynk.xcodeproj -scheme MusicLightSynkiOS -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios-dd CODE_SIGNING_ALLOWED=NO build
          STAGE="build/Music Light Synk iPhone"
          rm -rf "$STAGE" && mkdir -p "$STAGE/apple"
          cp -R ios "$STAGE/ios"
          cp -R apple/Package.swift apple/Sources "$STAGE/apple/"
          (cd build && zip -qr music-light-synk-iphone-project.zip "Music Light Synk iPhone")

      - uses: actions/upload-artifact@v4
        with:
          name: music-light-synk-apple
          path: |
            build/music-light-synk-mac.zip
            build/music-light-synk-iphone-project.zip
          if-no-files-found: error

  # On main: publish a GitHub Release (APK, integration zip, blueprints) whenever the version
  # is new. Bump versionName + manifest version + CHANGELOG to cut the next release.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [apk, home-assistant, apple]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Is this version already released?
        id: v
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "v$VERSION already released - nothing to do"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.v.outputs.new == 'true'
        with:
          name: music-light-synk-apk

      - uses: actions/download-artifact@v4
        if: steps.v.outputs.new == 'true'
        with:
          name: music-light-synk-apple

      - name: Release notes and integration zip
        if: steps.v.outputs.new == 'true'
        run: |
          python3 scripts/release_notes.py "${{ steps.v.outputs.version }}" > release-notes.md
          (cd custom_components && zip -qr ../music_light_synk.zip music_light_synk)
          cp home-assistant/blueprints/automation/music_light_synk.yaml music_light_synk_blueprint.yaml
          cp home-assistant/blueprints/automation/music_light_synk_mqtt.yaml music_light_synk_mqtt_blueprint.yaml

      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.new == 'true'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Music Light Synk v${{ steps.v.outputs.version }}
          body_path: release-notes.md
          make_latest: true
          files: |
            music-light-synk.apk
            music-light-synk-mac.zip
            music-light-synk-iphone-project.zip
            music_light_synk.zip
            music_light_synk_blueprint.yaml
            music_light_synk_mqtt_blueprint.yaml
