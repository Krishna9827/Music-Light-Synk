name: Validate integration

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest (Home Assistant's own checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # brands/topics/description are only needed for the HACS *default* list,
          # not for adding this repo as a custom repository.
          ignore: brands topics description
